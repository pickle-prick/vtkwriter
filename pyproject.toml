[project]
name = "vtkwriter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "h5py>=3.15.1",
    "matplotlib>=3.10.7",
    "ansys-mapdl-reader>=0.55.2",
    "pyvista>=0.46.4",
    "scipy>=1.17.1",
    "vtk>=9.5.2",
    "websockets>=15.0.1",
]

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "scipy.*",
    "pyvista.*"
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
]
